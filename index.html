<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KhataPro | দোকান খাতা</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0b0614;--c:#ffffff0d;--c2:#ffffff12;--ln:#ffffff1f;--tx:#f5f0ff;--mu:#a99bc9;--gold:#b79bff;--g:#34d399;--r:#fb7185;--grad:linear-gradient(135deg,#8b5cf6,#d946ef)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{color:var(--tx);font:15px/1.5 'Hind Siliguri',system-ui,sans-serif;min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 104px}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(60vw 50vh at 8% -5%,#6d28d966,transparent),radial-gradient(55vw 45vh at 100% 12%,#c026d344,transparent),radial-gradient(70vw 50vh at 50% 112%,#4c1d9577,transparent)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
#app{max-width:520px;margin:0 auto;position:relative}
button,input,select{font:inherit;color:inherit}
input,select{width:100%;background:#ffffff0f;border:1px solid var(--ln);border-radius:12px;padding:12px 14px;outline:0;margin:5px 0}
input:focus,select:focus{border-color:#a78bfa;box-shadow:0 0 0 3px #8b5cf633}select option{background:#1a1030}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--grad);color:#fff;font-weight:700;cursor:pointer;width:100%;transition:transform .12s,box-shadow .2s;box-shadow:0 6px 22px #8b5cf638}
.btn:active{transform:scale(.97)}.btn.r{background:var(--r);color:#2a0610;box-shadow:none}.btn.g{background:var(--g);color:#032a1c;box-shadow:none}.btn.o{background:#ffffff12;color:var(--tx);border:1px solid var(--ln);box-shadow:none}.btn.s{width:auto;padding:6px 11px;font-size:13px;border-radius:10px}
.card{background:var(--c);border:1px solid var(--ln);border-radius:18px;padding:14px;margin:10px 0;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.hero{border-radius:22px;padding:18px;background:linear-gradient(135deg,#7c3aed66,#c026d333);border:1px solid #ffffff2e;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);margin:10px 0;box-shadow:0 10px 40px #7c3aed33}
.hero b{display:block;font-size:38px;line-height:1.25;color:#fff;text-shadow:0 0 26px #a78bfa99}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.g1{flex:1;min-width:0}.wr{flex-wrap:wrap}
.mu{color:var(--mu);font-size:13px}.red{color:var(--r)}.grn{color:var(--g)}
.av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:700;flex:none;color:#fff}
.it{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--ln);cursor:pointer}
.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nav{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:520px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:5;display:flex;background:#150b2bcc;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--ln);border-radius:20px;padding:5px}
#nav a{flex:1;text-align:center;padding:7px 0;border-radius:15px;color:var(--mu);font-size:11.5px;cursor:pointer}#nav i{display:block;font-style:normal;font-size:19px}#nav a.on{color:#fff;background:#8b5cf635}
.fab{position:fixed;right:max(20px,calc(50% - 240px));bottom:calc(env(safe-area-inset-bottom,0px) + 90px);width:54px;height:54px;border-radius:17px;border:0;background:var(--grad);color:#fff;font-size:28px;font-weight:700;box-shadow:0 8px 26px #a855f766;z-index:4}
#sh{display:none}#sh.on{display:block}.bd{position:fixed;inset:0;background:#000b;z-index:10}.bx{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:520px;bottom:0;z-index:11;background:#1a0f33f2;border-radius:24px 24px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);border-top:1px solid var(--ln);max-height:88vh;overflow:auto;animation:up .22s}
@keyframes up{from{opacity:.4;margin-bottom:-60px}}
#toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-90px);background:var(--grad);color:#fff;font-weight:600;padding:9px 18px;border-radius:12px;transition:transform .3s;z-index:20}#toast.on{transform:translate(-50%,0)}
.pill{font-size:12px;padding:2px 9px;border-radius:99px;background:#34d39922;color:var(--g)}.pill.x{background:#fb718522;color:var(--r)}.pill.y{background:#b79bff22;color:var(--gold)}
.hd{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.pw{text-align:center;padding-top:14px}.pw h1{font-size:26px;line-height:1.35;margin:10px 0 6px}
.chip{display:inline-block;padding:6px 12px;border-radius:99px;background:#ffffff0f;border:1px solid var(--ln);font-size:13px;margin:3px}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
h2{font-size:17px;margin:16px 0 4px}
.bars{display:flex;gap:8px;align-items:flex-end;height:90px}.bars div{flex:1;background:var(--grad);border-radius:6px 6px 0 0;min-height:3px}
.star{color:#fbbf24;letter-spacing:2px}.big2{font-size:44px;line-height:1.1}
.pb{height:6px;background:#ffffff14;border-radius:9px;flex:1;overflow:hidden}.pb div{height:100%;background:var(--grad)}
.sel{font-size:36px;color:#fbbf24;display:flex;gap:6px;cursor:pointer}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<canvas id=bg></canvas><div id="app"></div><div id="nav"></div><div id="sh"></div><div id="toast"></div>
<script>
/* ===== CONFIG ===== */
const CFG={BRAND:'KhataPro',NOTIFY:'' /* Cloudflare Worker URL (Telegram notifications) */,OWNER:'8583821482',PRICE:210,TRIAL:3,PAY:'01XXXXXXXXX',
 FB:'https://khatapro-7a4b1-default-rtdb.firebaseio.com'};
/* ================== */
const DAY=864e5,tg=window.Telegram&&Telegram.WebApp;
try{tg.ready();tg.expand();tg.setHeaderColor('#0b0614');tg.setBackgroundColor('#0b0614')}catch(e){}
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>'৳'+Math.round(n).toLocaleString('bn-BD'),dt=t=>new Date(t).toLocaleDateString('bn-BD',{day:'numeric',month:'short'}),rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)};
const notify=(t,to)=>{if(!CFG.NOTIFY)return;fetch(CFG.NOTIFY,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:t,to:to||'',initData:tg&&tg.initData||''})}).catch(()=>{})};
let LS=JSON.parse(localStorage.kdb||'{}');
const db={async get(p){if(CFG.FB){const r=await fetch(`${CFG.FB}/${p}.json`);if(!r.ok)throw new Error(r.status);return r.json()}let o=LS;for(const k of p.split('/')){o=o&&o[k]}return o==null?null:JSON.parse(JSON.stringify(o))},
async set(p,v){if(CFG.FB){const r=await fetch(`${CFG.FB}/${p}.json`,{method:'PUT',body:JSON.stringify(v)});if(!r.ok)throw new Error(r.status);return}const k=p.split('/');let o=LS;k.slice(0,-1).forEach(x=>o=o[x]=o[x]||{});v===null?delete o[k[k.length-1]]:o[k[k.length-1]]=v;localStorage.kdb=JSON.stringify(LS)}};
const U=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user,uid=String(U?U.id:(localStorage.demoUid||'demo1')),myName=U?((U.first_name||'')+' '+(U.last_name||'')).trim():(localStorage.demoName||'ডেমো দোকানদার');
const isOwner=()=>uid===CFG.OWNER;
let RV={},RS=5,me,ST,K,AD={users:{},pays:{}},S={sub:'',tab:'dash',q:'',cid:null,rp:7,uq:''};
const ok=()=>isOwner()||(me.exp>Date.now()&&!me.blk);
const dleft=()=>Math.max(0,Math.ceil((me.exp-Date.now())/DAY));
function loginScreen(){$('#app').innerHTML=`<div class=hd>${logo(38)}<b style="font-size:20px">${CFG.BRAND}</b></div><div class=pw><h1>লগইন</h1><p class=mu>টেলিগ্রামের ভেতর থেকে খুললে অটো লগইন হয়। ব্রাউজারে ব্যবহার করতে আপনার টেলিগ্রাম ID দিন।</p></div><div class=card><input id=li inputmode=numeric placeholder="টেলিগ্রাম ID"><input id=ln placeholder="আপনার নাম"><button class=btn data-a=login>চালিয়ে যান</button></div>`}
async function boot(){if(CFG.FB&&!U&&!localStorage.demoUid)return loginScreen();try{await boot0()}catch(e){$('#nav').style.display='none';$('#app').innerHTML=`<div class=pw><div class=card><h2>সংযোগ হয়নি</h2><p class=mu>Firebase Rules-এ read/write চালু আছে কিনা দেখুন, তারপর রিফ্রেশ দিন।</p><button class=btn data-a=reload>রিফ্রেশ</button></div></div>`}}
async function boot0(){try{RV=await db.get('reviews')||{}}catch(e){}ST=Object.assign({price:CFG.PRICE,trial:CFG.TRIAL,methods:[]},await db.get('settings')||{});
me=await db.get('users/'+uid);if(!me){me={n:myName,u:U&&U.username||'',j:Date.now(),exp:0};await db.set('users/'+uid,me);notify('🆕 নতুন ইউজার: '+me.n+' (ID '+uid+')')}
if(ok()){const k=await db.get('khata/'+uid)||{};K={c:k.c||{},t:k.t||{},shop:k.shop||''}}route()}
const bals=()=>{const b={};Object.values(K.t).forEach(x=>b[x.c]=(b[x.c]||0)+(x.k=='g'?x.a:-x.a));return b};
const sum=(a,f)=>a.filter(f).reduce((s,x)=>s+x.a,0);
const av=n=>`<div class=av style="background:hsl(${255+(n.charCodeAt(0)*37)%85} 55% 42%)">${esc(n[0]||'?')}</div>`;
function render(){let h;if(!ok())h=paywall();else h=S.tab=='dash'?dash():S.tab=='sub'?subPage():S.tab=='home'?(S.cid?cust():home()):S.tab=='rep'?rep():S.tab=='rev'?revView():S.tab=='adm'?adm():acc();
$('#app').innerHTML=h;const N=[['dash','🏠','ড্যাশ'],['home','📒','কাস্টমার'],['rep','📊','রিপোর্ট'],['rev','⭐','রিভিউ'],['acc','👤','আমি']];if(isOwner())N.push(['adm','🛡️','অ্যাডমিন']);
$('#nav').innerHTML=ok()?N.map(n=>`<a data-a=go data-t=${n[0]} class="${S.tab==n[0]?'on':''}"><i>${n[1]}</i>${n[2]}</a>`).join(''):'';$('#nav').style.display=ok()?'flex':'none'}
function home(){const b=bals(),T=Object.values(K.t),t0=new Date().setHours(0,0,0,0),q=S.q.toLowerCase();
const L=Object.entries(K.c).map(([id,c])=>({id,...c,b:b[id]||0})).filter(c=>!q||(c.n+(c.p||'')).toLowerCase().includes(q)).sort((a,b)=>b.b-a.b);
const tot=Object.values(b).reduce((s,x)=>s+(x>0?x:0),0);
return `<div class="row sp"><div class=row>${logo()}<div><div class=mu>${esc(K.shop||'আপনার দোকান')}</div><b style="font-size:18px">${CFG.BRAND}</b></div></div>${isOwner()?'':`<span class="pill ${dleft()<4?'y':''}">${dleft()} দিন বাকি</span>`}</div>
<div class=card><div class="row sp"><span class=mu>মোট বাকি</span><b class=red>${fmt(tot)}</b></div></div>
<input id=q placeholder="🔍 কাস্টমার খুঁজুন" value="${esc(S.q)}">
<div class=card style="padding:4px 12px">${L.length?L.map(c=>`<div class=it data-a=open data-id=${c.id}>${av(c.n)}<div class=g1><div class=nm>${esc(c.n)}</div><div class=mu>${esc(c.p||'ফোন নেই')}</div></div><div style="text-align:right"><b class="${c.b>0?'red':'grn'}">${fmt(Math.abs(c.b))}</b><div class=mu>${c.b>0?'বাকি':c.b<0?'জমা':'শূন্য'}</div></div></div>`).join(''):'<div class=mu style="padding:26px;text-align:center">কোনো কাস্টমার নেই। নিচের + চেপে প্রথম কাস্টমার যোগ করুন।</div>'}</div><button class=fab data-a=addc>+</button>`}
function cust(){const c=K.c[S.cid];if(!c){S.cid=null;return home()}
const X=Object.entries(K.t).filter(([,x])=>x.c==S.cid).sort((a,b)=>b[1].ts-a[1].ts),bal=bals()[S.cid]||0;
return `<div class=row><button class="btn o s" data-a=back>←</button><div class="g1 nm"><b>${esc(c.n)}</b><div class=mu>${esc(c.p||'')}</div></div><button class="btn o s" data-a=dc>🗑</button></div>
<div class=hero><div class=mu>${bal>0?'তিনি আপনাকে দেবেন':bal<0?'আপনি তাকে দেবেন':'হিসাব শূন্য'}</div><b>${fmt(Math.abs(bal))}</b></div>
<div class="gr"><button class="btn r" data-a=tx data-k=g>বাকি দিলাম</button><button class="btn g" data-a=tx data-k=r>টাকা পেলাম</button></div>
${c.p?`<div class="row" style="margin-top:10px"><button class="btn o s g1" data-a=rem data-w=wa>💬 হোয়াটসঅ্যাপ</button><button class="btn o s g1" data-a=rem data-w=sms>✉️ এসএমএস</button><a class="btn o s g1" style="text-align:center;text-decoration:none" href="tel:${esc(c.p)}">📞 কল</a></div>`:''}
<h2>লেনদেন</h2><div class=card style="padding:4px 12px">${X.length?X.map(([id,x])=>`<div class=it style="cursor:default"><div class=g1><b class="${x.k=='g'?'red':'grn'}">${x.k=='g'?'বাকি':'জমা'} ${fmt(x.a)}</b><div class=mu>${dt(x.ts)} ${esc(x.n||'')}</div></div><button class="btn o s" data-a=dt data-id=${id}>✕</button></div>`).join(''):'<div class=mu style="padding:20px;text-align:center">এখনও কোনো লেনদেন নেই</div>'}</div>`}
function rep(){const T=Object.values(K.t),t0=new Date().setHours(0,0,0,0),f=Date.now()-S.rp*DAY,P=T.filter(x=>x.ts>=f),b=bals();
const bars=[...Array(7)].map((_,i)=>{const s=t0-(6-i)*DAY;return sum(T,x=>x.ts>=s&&x.ts<s+DAY&&x.k=='g')}),mx=Math.max(...bars,1);
const top=Object.entries(b).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,5);
return `<h2 style="margin-top:0">রিপোর্ট</h2><div class=row><button class="btn s ${S.rp==7?'':'o'}" data-a=rp data-d=7>৭ দিন</button><button class="btn s ${S.rp==30?'':'o'}" data-a=rp data-d=30>৩০ দিন</button></div>
<div class=gr style="margin-top:10px"><div class=card><div class=mu>বাকি দেওয়া</div><b class=red style="font-size:22px">${fmt(sum(P,x=>x.k=='g'))}</b></div><div class=card><div class=mu>টাকা পাওয়া</div><b class=grn style="font-size:22px">${fmt(sum(P,x=>x.k=='r'))}</b></div></div>
<div class=card><div class=mu style="margin-bottom:8px">গত ৭ দিনে বাকি দেওয়া</div><div class=bars>${bars.map(v=>`<div style="height:${v/mx*100}%"></div>`).join('')}</div></div>
<h2>সবচেয়ে বেশি বাকি</h2><div class=card style="padding:4px 12px">${top.length?top.map(([id,v])=>`<div class=it data-a=open data-id=${id}>${av(K.c[id].n)}<div class="g1 nm">${esc(K.c[id].n)}</div><b class=red>${fmt(v)}</b></div>`).join(''):'<div class=mu style="padding:16px;text-align:center">কারো বাকি নেই 🎉</div>'}</div>`}
function acc(){return `<h2 style="margin-top:0">অ্যাকাউন্ট</h2><div class=card><div class=row>${av(me.n||'?')}<div class=g1><b>${esc(me.n)}</b><div class=mu>${me.u?'@'+esc(me.u):'ID: '+uid}</div></div>${isOwner()?'<span class=pill>মালিক</span>':`<span class="pill ${dleft()<4?'x':''}">${dleft()} দিন বাকি</span>`}</div></div>
<div class=card><div class=mu>দোকানের নাম</div><input id=shop value="${esc(K.shop)}" placeholder="যেমন: রহমান স্টোর"><button class=btn data-a=shop>সংরক্ষণ</button></div>
${isOwner()?'':`<div class=card><div class=mu>মাসিক ফি ${fmt(ST.price)}</div><button class="btn o" data-a=renew>🔁 রিনিউ করুন</button></div>`}
<div class=card><button class="btn o" data-a=copy>📋 ব্যাকআপ কপি করুন (CSV)</button></div>
${!U?`<div class=card><button class="btn o" data-a=demo>${CFG.FB?'🚪 লগআউট (ব্রাউজার)':isOwner()?'দোকানদার হিসেবে দেখুন':'মালিক হিসেবে দেখুন'}</button></div>`:''}`}
const stars=n=>'★'.repeat(n)+'☆'.repeat(5-n),sel=()=>[1,2,3,4,5].map(i=>`<span data-a=star data-n=${i}>${i<=RS?'★':'☆'}</span>`).join('');
const logo=(z=34)=>`<svg width=${z} height=${z} viewBox="0 0 32 32"><defs><linearGradient id=lg x1=0 y1=0 x2=1 y2=1><stop offset=0 stop-color="#a78bfa"/><stop offset=1 stop-color="#d946ef"/></linearGradient></defs><rect width=32 height=32 rx=9 fill="url(#lg)"/><path d="M9 9h11a3 3 0 0 1 3 3v11H12a3 3 0 0 1-3-3z" fill=none stroke=#fff stroke-width=2 stroke-linejoin=round /><path d="M13 16l3 3 5-6" fill=none stroke=#fff stroke-width=2 stroke-linecap=round /></svg>`;
function revDash(){const L=Object.entries(RV),n=L.length,avg=n?L.reduce((s,[,r])=>s+r.r,0)/n:0,cnt=[5,4,3,2,1].map(k=>L.filter(([,r])=>r.r==k).length);
return `<div class=card><div class=row><div style="text-align:center"><b class=big2>${n?avg.toLocaleString('bn-BD',{minimumFractionDigits:1,maximumFractionDigits:1}):'–'}</b><div class=star>${stars(Math.round(avg))}</div><div class=mu>${n.toLocaleString('bn-BD')} রিভিউ</div></div><div class=g1>${cnt.map((c,i)=>`<div class=row style="gap:6px"><span class=mu>${(5-i).toLocaleString('bn-BD')}★</span><div class=pb><div style="width:${n?c/n*100:0}%"></div></div><span class=mu>${c.toLocaleString('bn-BD')}</span></div>`).join('')}</div></div></div>`+(n?L.sort((a,b)=>b[1].ts-a[1].ts).slice(0,20).map(([id,r])=>`<div class=card><div class="row sp"><div class=row>${av(r.n||'?')}<b>${esc(r.n)}</b></div><span class=star>${stars(r.r)}</span></div><p>${esc(r.t)}</p><div class="row sp"><span class=mu>${dt(r.ts)}</span>${isOwner()?`<button class="btn r s" data-a=delrev data-id=${id}>মুছুন</button>`:''}</div></div>`).join(''):'<div class="card mu" style="text-align:center">এখনও কোনো রিভিউ নেই। প্রথম রিভিউটা আপনারই হোক।</div>')}
